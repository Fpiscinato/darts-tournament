<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2030" />
    <script>
      // Pre-paint: match the OS preference so dark users don't see a light flash
      // before IndexedDB finishes loading the saved preference.
      try {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
        if (!m || m.matches) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <meta name="description" content="Live darts tournament scoring, brackets and standings." />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darts" />
    <title>Darts Tournament</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
